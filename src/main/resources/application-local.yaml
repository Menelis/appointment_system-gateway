spring:
  application:
    name: appointment-gateway
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: book-service
              uri: http://localhost:9008
              predicates:
                - Path=/book/**
          default-filters:
            - TokenRelay # Token relay filter appends the oauth (or jwt) token to request header before forwarding requests
  security:
    oauth2:
      client:
        provider:
          platform-auth-server:
            issuer-uri: http://127.0.0.1:9000
        registration:
          gateway-client:
            provider: platform-auth-server
            client-id: gateway-client
            client-secret: 8adLFE4RHIqYOXhB7ZLjgqdRJWAioTMzlblC8XyKrc8=
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:9001/login/oauth2/code/gateway-client
            scope:
              - openid
              - profile
              - email
